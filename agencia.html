const QR=(()=>{
 const ECC_M_CW=[0,10,16,26,18,24,16,18,22,22,26];      // codewords de corrección por bloque (nivel M)
 const BLOCKS_M=[0,1,1,1,2,2,4,4,4,5,5];                // número de bloques (nivel M)
 const ALIGN=[[],[],[6,18],[6,22],[6,26],[6,30],[6,34],[6,22,38],[6,24,42],[6,26,46],[6,28,50]];
 function rawModules(v){let r=(16*v+128)*v+64;if(v>=2){const n=Math.floor(v/7)+2;r-=(25*n-10)*n-55;if(v>=7)r-=36;}return r;}
 const dataCW=v=>Math.floor(rawModules(v)/8)-ECC_M_CW[v]*BLOCKS_M[v];
 function gmul(x,y){let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x;}return z&255;}
 function rsDiv(deg){const r=new Array(deg).fill(0);r[deg-1]=1;let root=1;for(let i=0;i<deg;i++){for(let j=0;j<r.length;j++){r[j]=gmul(r[j],root);if(j+1<r.length)r[j]^=r[j+1];}root=gmul(root,2);}return r;}
 function rsRem(data,div){const r=div.map(()=>0);for(const b of data){const f=b^r.shift();r.push(0);div.forEach((c,i)=>r[i]^=gmul(c,f));}return r;}
 function encode(text){
  const bytes=[...new TextEncoder().encode(text)];let v=1;
  for(;v<=10;v++){const cc=v<10?8:16;if(4+cc+bytes.length*8<=dataCW(v)*8)break;}
  if(v>10)throw new Error('Texto demasiado largo para el QR');
  const bits=[];const put=(val,n)=>{for(let i=n-1;i>=0;i--)bits.push((val>>>i)&1);};
  put(4,4);put(bytes.length,v<10?8:16);bytes.forEach(b=>put(b,8));
  const cap=dataCW(v)*8;put(0,Math.min(4,cap-bits.length));put(0,(8-bits.length%8)%8);
  for(let p=0xEC;bits.length<cap;p^=0xEC^0x11)put(p,8);
  const data=[];for(let i=0;i<bits.length;i+=8)data.push(parseInt(bits.slice(i,i+8).join(''),2));
  // bloques y corrección
  const nb=BLOCKS_M[v],ec=ECC_M_CW[v],raw=Math.floor(rawModules(v)/8),nShort=nb-raw%nb,shortLen=Math.floor(raw/nb);
  const div=rsDiv(ec);const blocks=[];let k=0;
  for(let i=0;i<nb;i++){const dl=shortLen-ec+(i<nShort?0:1);const d=data.slice(k,k+dl);k+=dl;const e=rsRem(d,div);if(i<nShort)d.push(0);blocks.push(d.concat(e));}
  const all=[];for(let i=0;i<blocks[0].length;i++)blocks.forEach((b,j)=>{if(i!==shortLen-ec||j>=nShort)all.push(b[i]);});
  // matriz
  const n=v*4+17,M=[...Array(n)].map(()=>Array(n).fill(false)),F=[...Array(n)].map(()=>Array(n).fill(false));
  const set=(x,y,d)=>{M[y][x]=d;F[y][x]=true;};
  for(let i=0;i<n;i++){set(6,i,i%2===0);set(i,6,i%2===0);}
  const finder=(cx,cy)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const d=Math.max(Math.abs(dx),Math.abs(dy)),x=cx+dx,y=cy+dy;if(x>=0&&x<n&&y>=0&&y<n)set(x,y,d!==2&&d!==4);}};
  finder(3,3);finder(n-4,3);finder(3,n-4);
  const al=ALIGN[v];al.forEach((a,i)=>al.forEach((b,j)=>{if((i===0&&j===0)||(i===0&&j===al.length-1)||(i===al.length-1&&j===0))return;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)set(a+dx,b+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1);}));
  const fmt=mask=>{const d=(0<<3)|mask;let r=d;for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);const b=((d<<10)|r)^0x5412;const g=i=>((b>>>i)&1)!==0;
   for(let i=0;i<=5;i++)set(8,i,g(i));set(8,7,g(6));set(8,8,g(7));set(7,8,g(8));for(let i=9;i<15;i++)set(14-i,8,g(i));
   for(let i=0;i<8;i++)set(n-1-i,8,g(i));for(let i=8;i<15;i++)set(8,n-15+i,g(i));set(8,n-8,true);};
  fmt(0);
  if(v>=7){let r=v;for(let i=0;i<12;i++)r=(r<<1)^((r>>>11)*0x1F25);const b=(v<<12)|r;for(let i=0;i<18;i++){const bit=((b>>>i)&1)!==0,a=n-11+i%3,c=Math.floor(i/3);set(a,c,bit);set(c,a,bit);}}
  // datos en zigzag
  let i=0;for(let right=n-1;right>=1;right-=2){if(right===6)right=5;for(let vert=0;vert<n;vert++)for(let j=0;j<2;j++){const x=right-j,up=((right+1)&2)===0,y=up?n-1-vert:vert;
   if(!F[y][x]&&i<all.length*8){M[y][x]=((all[i>>>3]>>>(7-(i&7)))&1)!==0;i++;}}}
  // máscara con menor penalización
  const maskFn=[(x,y)=>(x+y)%2===0,(x,y)=>y%2===0,(x,y)=>x%3===0,(x,y)=>(x+y)%3===0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,(x,y)=>x*y%2+x*y%3===0,(x,y)=>(x*y%2+x*y%3)%2===0,(x,y)=>((x+y)%2+x*y%3)%2===0];
  const applyMask=m=>{for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(!F[y][x]&&maskFn[m](x,y))M[y][x]=!M[y][x];};
  const penalty=()=>{let p=0;for(let y=0;y<n;y++){let run=1;for(let x=1;x<=n;x++){if(x<n&&M[y][x]===M[y][x-1])run++;else{if(run>=5)p+=run-2;run=1;}}}
   for(let x=0;x<n;x++){let run=1;for(let y=1;y<=n;y++){if(y<n&&M[y][x]===M[y-1][x])run++;else{if(run>=5)p+=run-2;run=1;}}}
   for(let y=0;y<n-1;y++)for(let x=0;x<n-1;x++){const c=M[y][x];if(c===M[y][x+1]&&c===M[y+1][x]&&c===M[y+1][x+1])p+=3;}
   const pat=[true,false,true,true,true,false,true];const chk=(get)=>{for(let a=0;a<n;a++)for(let b=0;b+7<=n;b++){if(pat.every((q,t)=>get(a,b+t)===q)){const before=b>=4&&[1,2,3,4].every(t=>!get(a,b-t)),after=b+11<=n&&[7,8,9,10].every(t=>!get(a,b+t));if(before||after)p+=40;}}};
   chk((a,b)=>M[a][b]);chk((a,b)=>M[b][a]);let dark=0;M.forEach(r=>r.forEach(c=>{if(c)dark++;}));p+=Math.floor(Math.abs(dark*20-n*n*10)/(n*n))*10;return p;};
  let best=0,bp=Infinity;for(let m=0;m<8;m++){applyMask(m);fmt(m);const p=penalty();if(p<bp){bp=p;best=m;}applyMask(m);}
  applyMask(best);fmt(best);return M;}
 function svg(text,px=6,color='#165277'){const M=encode(text),n=M.length,q=4,s=(n+q*2);let d='';
  M.forEach((r,y)=>r.forEach((c,x)=>{if(c)d+=`M${x+q},${y+q}h1v1h-1z`;}));
  return `<svg viewBox="0 0 ${s} ${s}" width="${s*px}" height="${s*px}" shape-rendering="crispEdges" role="img" aria-label="Código QR"><rect width="${s}" height="${s}" fill="#fff"/><path d="${d}" fill="${color}"/></svg>`;}
 return {encode,svg};})();

function diaLbl(d){const t=tdbIso(0),m=tdbIso(1);if(d===t)return'Hoy';if(d===m)return'Mañana';const[y,mo,dd]=d.split('-').map(Number);return new Date(y,mo-1,dd).toLocaleDateString('es-EC',{weekday:'short',day:'numeric',month:'short'});}
const tipoN=k=>k.k==='v'?`Vuelo ${[k.a,k.f].filter(Boolean).join(' ')}${k.rt?' · '+k.rt:''}`:k.k==='x'?'Traslado':'Recorrido';
const estTag=e=>e==='recogido'?'<span class="tag ok">Recogido</span>':e==='cancelado'?'<span class="tag w">Cancelado</span>':'<span class="tag">Pendiente</span>';
const ICO={acceso:'Ingreso',sello:'Sello',recuerdo:'Recuerdo',recorrido:'Recorrido',ruta:'Ruta',guia:'Guía',qr:'Descuento QR',asistente:'Asistente',hotel:'Hotel',pickup:'Pickup'};
function ago(ts){const m=Math.round((Date.now()-ts)/60000);if(m<1)return'ahora';if(m<60)return`hace ${m} min`;const h=Math.round(m/60);if(h<24)return`hace ${h} h`;return`hace ${Math.round(h/24)} d`;}
function stamps(db,pid){return [...new Set(db.actividad.filter(a=>a.pax===pid&&a.tipo==='sello').map(a=>a.lugar))].filter(x=>PLN[x]);}
function allPickups(db,guia){const L=[];db.pasajeros.forEach(p=>(p.pickups||[]).forEach(k=>{if(!guia||p.guia===guia)L.push({p,k});}));return L.sort((a,b)=>(a.k.d+a.k.t).localeCompare(b.k.d+b.k.t));}

 ({resumen,pasajeros,pickups,actividad,equipo,hoy,mispax}[TAB]||resumen)(db);}

 const act=db.pasajeros.filter(p=>p.llegada<=tdbIso(0)&&p.salida>=tdbIso(0)).length,sel=db.actividad.filter(a=>a.tipo==='sello');

   pickups:[...pks.querySelectorAll('.pk')].map(d=>{const k={id:d.dataset.id,d:d.querySelector('.d').value,t:d.querySelector('.t').value,k:d.querySelector('.k').value,n:d.querySelector('.n').value.trim(),e:d.querySelector('.e').value};if(k.k==='v'){k.a=d.querySelector('.a').value.trim();k.f=d.querySelector('.f').value.trim().toUpperCase();k.rt=d.querySelector('.r').value.trim().toUpperCase();}return k;}).filter(k=>k.d&&k.t)});
  if(!id){D.seq=(D.seq||0)+1;p.id='P'+D.seq+Date.now().toString(36).slice(-3);p.codigo='ZS3-'+String(D.seq).padStart(4,'0');D.pasajeros.push(p);}else{const i=D.pasajeros.findIndex(x=>x.id===id);D.pasajeros[i]=p;}
  tdbSave(D);toast(id?'Reserva actualizada':'Reserva creada · '+p.codigo);render();paxSheet(p.id);};}
function bindCommon(root=document){
 root.querySelectorAll('[data-pax]').forEach(b=>b.onclick=()=>paxSheet(b.dataset.pax));
 root.querySelectorAll('[data-t2]').forEach(b=>b.onclick=()=>{TAB=b.dataset.t2;render();});
 root.querySelectorAll('[data-wa]').forEach(b=>b.onclick=e=>{e.stopPropagation();const p=tdbLoad().pasajeros.find(x=>x.id===b.dataset.wa);window.open('https://wa.me/'+(p.tel||'').replace(/\D/g,'')+'?text='+encodeURIComponent(`Hola ${p.nombre.split(' · ').pop().split(' ')[0]}, te escribe ${ME.nombre} de ZEROS3.`),'_blank');});
 root.querySelectorAll('[data-rec]').forEach(b=>b.onclick=e=>{e.stopPropagation();const[pid,kid]=b.dataset.rec.split('|');tdbUpdatePax(pid,p=>{const k=p.pickups.find(x=>x.id===kid);if(k)k.e='recogido';});tdbLog(pid,'pickup','Recogido por '+ME.nombre);toast('Pickup marcado como recogido');render();});}
window.addEventListener('storage',e=>{if(e.key===TDB_KEY&&ME&&!$('#modal').classList.contains('on'))render();});
render();
</script></body></html>
